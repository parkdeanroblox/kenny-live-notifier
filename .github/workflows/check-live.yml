name: Check Kenny's TikTok LIVE

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tiktok-live-check
  cancel-in-progress: false

jobs:
  check-live:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Restore previous LIVE state
        uses: actions/cache@v4
        with:
          path: live_state.json
          key: tiktok-live-state-${{ github.run_id }}
          restore-keys: |
            tiktok-live-state-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check TikTok and notify BotGhost
        env:
          BOTGHOST_WEBHOOK: ${{ secrets.BOTGHOST_WEBHOOK }}
          BOTGHOST_API_KEY: ${{ secrets.BOTGHOST_API_KEY }}
        run: python monitor.py
